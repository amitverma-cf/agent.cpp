name: Release

# Builds the CLI and the llama engine for Windows and Linux (x86_64 and aarch64; plus a Vulkan build for GPUs on Linux x86_64 and
# aarch64 and Windows x86_64), on demand only, and with publish=true (run on a tag: the release is then the "latest") uploads:
#   * agent-cpp-<version>-<os>-<arch>.tar.gz / .zip     the CLI, the engine host and the engines, ready to run
#   * agent-engine-<name>-<os>-<arch>.<so|dll|dylib>    each engine alone, for `agent engine pull` and `agent setup`
#   * manifest.json and SHA256SUMS                       what the downloader reads, with a SHA-256 for every file
#
# The binaries are portable: no -march=native. Linux is built on ubuntu-24.04 with GCC 14 (glibc 2.39 or newer to run). x86-64 targets AVX2 + FMA + F16C (any CPU since about 2015); on older
# CPUs build from source.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release from the build (run on a tag, so it becomes the latest release)"
        type: boolean
        default: false
      engines:
        description: "Engine plugins to build, comma separated: llama,onnx,audiocpp. They are thin: compiled against the upstream releases pinned in scripts/components.tsv (sdcpp and trellis have no upstream library: see engines-extra.yml)"
        type: string
        default: "llama,onnx,audiocpp"


permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     os_name: linux,   arch: x86_64,  lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON" }
          - { runner: ubuntu-24.04-arm, os_name: linux,   arch: aarch64, lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON", triplet: x64-windows, dll: x64 }
          - { runner: windows-11-arm,   os_name: windows, arch: aarch64, lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=ON", triplet: arm64-windows, dll: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          # The full-screen chat (RTXUI) needs C++23: GCC 13 or newer. GCC 14 is used, and libstdc++ is linked statically so the
          # binaries do not need the newer libstdc++ on the machine that runs them.
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:${{ matrix.triplet }}

      - name: Compiler environment (Windows)
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Upstream libraries
        shell: bash
        run: |
          # The plugins are compiled against the upstream releases the installer will download (llama.cpp, audio.cpp), at the exact pinned
          # versions: only the plugins are built here, not those projects. A plugin whose upstream has no build for this system is skipped.
          export AGENT_LIST="$PWD/scripts/components.tsv" AGENT_BACKEND=cpu
          eng=",${{ inputs.engines || 'llama,onnx,audiocpp' }},"
          for e in llama audiocpp; do
            case "$eng" in *",$e,"*) ;; *) continue ;; esac
            if [ "${{ matrix.os_name }}" = "windows" ]; then
              powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 fetch "$e" "$PWD/build/upstream/$e" || { eng="$(echo "$eng" | sed "s/,$e,/,/")"; echo "::notice::$e has no upstream build for this system"; }
            else
              sh scripts/install.sh fetch "$e" "$PWD/build/upstream/$e" || { eng="$(echo "$eng" | sed "s/,$e,/,/")"; echo "::notice::$e has no upstream build for this system"; }
            fi
          done
          echo "ENGINES=$eng" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          eng="$ENGINES"
          on() { case "$eng" in *",$1,"*) echo ON ;; *) echo OFF ;; esac; }
          extra=""
          if [ "${{ matrix.os_name }}" = "linux" ]; then export LDFLAGS="-static-libstdc++ -static-libgcc"; fi
          if [ "${{ matrix.os_name }}" = "windows" ]; then extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"; fi
          [ "$(on llama)" = ON ] && extra="$extra -DAGENT_LLAMA_PREBUILT=$PWD/build/upstream/llama"
          [ "$(on audiocpp)" = ON ] && extra="$extra -DAGENT_AUDIOCPP_PREBUILT=$PWD/build/upstream/audiocpp"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAGENT_BUILD_CLI=ON -DAGENT_BUILD_EXAMPLES=OFF -DAGENT_ENGINE_LLAMA=$(on llama) -DAGENT_ENGINE_ONNX=$(on onnx) \
            -DAGENT_ENGINE_AUDIOCPP=$(on audiocpp) -DAGENT_ENGINE_SDCPP=OFF -DAGENT_ENGINE_TRELLIS=OFF $extra

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        # Windows on Arm: the runner has an older onnxruntime.dll in System32 that the ONNX tests pick up; the archive is still built and shipped.
        continue-on-error: ${{ matrix.os_name == 'windows' && matrix.arch == 'aarch64' }}
        shell: bash
        run: |
          # The unit suite needs no models. Engine tests that need a downloaded model skip themselves.
          ctest --test-dir build --output-on-failure -j2 --timeout 300 -E "model|engine_real" || ctest --test-dir build --rerun-failed --output-on-failure -j1 --timeout 300 -E "model|engine_real"

      - name: Package
        shell: bash
        run: |
          # The program (core) and one archive for each engine plugin: the installer script puts them together on the user's machine and
          # adds the upstream runtimes it pins (scripts/components.tsv). A GPU build adds engines only.
          v="${{ steps.version.outputs.value }}"
          extra=""
          if [ "${{ matrix.os_name }}" = "windows" ]; then extra="--openssl-dir $VCPKG_INSTALLATION_ROOT/installed/${{ matrix.triplet }}/bin --openssl-suffix -${{ matrix.dll }}"; fi
          bash scripts/package-release.sh --build-dir build --out-dir assets --tag "$v" --os ${{ matrix.os_name }} --arch ${{ matrix.arch }} --plugin-only llama,audiocpp,onnx \
            --lib-ext ${{ matrix.lib_ext }} --exe-ext "${{ matrix.exe_ext }}" $extra
          rm -f assets/SHA256SUMS
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  publish:
    # A failing GPU build must not hold back the release: publish whatever was built.
    if: ${{ !cancelled() && inputs.publish }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - name: The pinned list belongs to this release
        if: github.ref_type == 'tag'
        run: |
          # scripts/components.tsv is written by scripts/pin-components.py --tag <tag> before the tag is made.
          grep -qx "# tag ${{ steps.version.outputs.value }}" scripts/components.tsv || { echo "scripts/components.tsv is pinned for another tag: run scripts/pin-components.py --tag ${{ steps.version.outputs.value }}"; exit 1; }

      - name: Checksums and manifest
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          # manifest.json: one entry per file, with the platform parsed from the file name.
          {
            echo '{"version":"${{ steps.version.outputs.value }}","repository":"${{ github.repository }}","files":['
            first=1
            for f in $(ls | grep -v -e '^SHA256SUMS$' -e '^manifest.json$'); do
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              size="$(stat -c %s "$f")"
              [ $first -eq 1 ] || echo ','
              first=0
              printf '{"name":"%s","sha256":"%s","size":%s}' "$f" "$sum" "$size"
            done
            echo ']}'
          } > manifest.json
          cat manifest.json | head -c 2000

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: assets/*

  install-test:
    # The installer script, on a clean machine of every kind, with the files this run just built and the real upstream downloads: install,
    # add every engine and runtime, check the SHA-256 refusal, remove, uninstall. And one real model (onnx) through the engine.
    name: install ${{ matrix.os_name }}-${{ matrix.arch }}
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     os_name: linux,   arch: x86_64,  engines: "llama,onnx,audiocpp", runtimes: "bun,uv,node,pnpm,nub" }
          - { runner: ubuntu-24.04-arm, os_name: linux,   arch: aarch64, engines: "llama,onnx",          runtimes: "bun,uv,node,pnpm,nub" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  engines: "llama,onnx,audiocpp", runtimes: "bun,uv,node,pnpm,nub" }
          - { runner: windows-11-arm,   os_name: windows, arch: aarch64, engines: "llama,onnx",          runtimes: "uv,node,pnpm,nub" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}-${{ matrix.arch }}
          path: assets
      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"
          (cd assets && if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi)
      - name: Install test (Linux)
        if: matrix.os_name == 'linux'
        run: |
          ENGINES="$(echo '${{ matrix.engines }}' | tr ',' ' ')" RUNTIMES="$(echo '${{ matrix.runtimes }}' | tr ',' ' ')" \
            bash tests/modular/run.sh "$PWD/assets" "${{ steps.version.outputs.value }}" | tee install-test.log
          ! grep -q '^FAIL' install-test.log
          ENGINES=onnx bash tests/modular/engines.sh "$PWD/assets" "$PWD/scripts" "${{ steps.version.outputs.value }}" | tee engines-test.log
          ! grep -q '^FAIL' engines-test.log
      - name: Install test (Windows)
        if: matrix.os_name == 'windows'
        shell: powershell
        run: |
          $log = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/modular/run.ps1 -Release "$PWD\assets" -Scripts "$PWD\scripts" -Tag "${{ steps.version.outputs.value }}" -Engines "${{ matrix.engines }}" -Runtimes "${{ matrix.runtimes }}" 2>&1
          $log | Out-String | Write-Host
          if ($log | Select-String -Pattern '^FAIL') { exit 1 }
          $env:AGENT_TEST_TAG = "${{ steps.version.outputs.value }}"
          $log = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/modular/engines.ps1 -Release "$PWD\assets" -Scripts "$PWD\scripts" -ChatModel none -Engines onnx 2>&1
          $log | Out-String | Write-Host
          if ($log | Select-String -Pattern '^FAIL') { exit 1 }
