name: Release

# Builds the CLI and the llama engine for Windows and Linux (x86_64 and aarch64; plus a Vulkan build for GPUs on Linux x86_64 and
# aarch64 and Windows x86_64), on demand only, and with publish=true (run on a tag: the release is then the "latest") uploads:
#   * agent-cpp-<version>-<os>-<arch>.tar.gz / .zip     the CLI, the engine host and the engines, ready to run
#   * agent-engine-<name>-<os>-<arch>.<so|dll|dylib>    each engine alone, for `agent engine pull` and `agent setup`
#   * manifest.json and SHA256SUMS                       what the downloader reads, with a SHA-256 for every file
#
# The binaries are portable: no -march=native. Linux is built on ubuntu-24.04 with GCC 14 (glibc 2.39 or newer to run). x86-64 targets AVX2 + FMA + F16C (any CPU since about 2015); on older
# CPUs build from source.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release from the build (run on a tag, so it becomes the latest release)"
        type: boolean
        default: false
      engines:
        description: "Engines to build and ship, comma separated: llama,onnx,audiocpp,sdcpp,trellis"
        type: string
        default: "llama,onnx,audiocpp,sdcpp,trellis"


permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     os_name: linux,   arch: x86_64,  lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON" }
          - { runner: ubuntu-24.04-arm, os_name: linux,   arch: aarch64, lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON", triplet: x64-windows, dll: x64 }
          - { runner: windows-11-arm,   os_name: windows, arch: aarch64, lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=ON", triplet: arm64-windows, dll: arm64 }
          # GPU builds (Vulkan: NVIDIA, AMD, Intel). The driver brings the Vulkan loader; the installer picks this build when it is there.
          - { runner: ubuntu-24.04,     os_name: linux,   arch: x86_64,  variant: "-vulkan", lib_prefix: lib, lib_ext: so,  exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_VULKAN=ON" }
          - { runner: ubuntu-24.04-arm, os_name: linux,   arch: aarch64, variant: "-vulkan", lib_prefix: lib, lib_ext: so,  exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  variant: "-vulkan", lib_prefix: "",  lib_ext: dll, exe_ext: ".exe", ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_VULKAN=ON", triplet: x64-windows, dll: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          # The full-screen chat (RTXUI) needs C++23: GCC 13 or newer. GCC 14 is used, and libstdc++ is linked statically so the
          # binaries do not need the newer libstdc++ on the machine that runs them.
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev g++-14 ${{ matrix.variant == '-vulkan' && 'libvulkan-dev glslc spirv-headers' || '' }}
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:${{ matrix.triplet }}
          if [ "${{ matrix.variant }}" = "-vulkan" ]; then
            choco install vulkan-sdk -y --no-progress
            sdk="$(ls -d /c/VulkanSDK/* | sort | tail -1)"
            echo "VULKAN_SDK=C:/VulkanSDK/$(basename "$sdk")" >> "$GITHUB_ENV"
          fi

      - name: Compiler environment (Windows)
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Configure
        shell: bash
        run: |
          eng=",${{ inputs.engines || 'llama' }},"
          on() { case "$eng" in *",$1,"*) echo ON ;; *) echo OFF ;; esac; }
          extra=""
          if [ "${{ matrix.os_name }}" = "linux" ]; then export LDFLAGS="-static-libstdc++ -static-libgcc"; fi
          if [ "${{ matrix.os_name }}" = "windows" ]; then extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAGENT_BUILD_CLI=ON -DAGENT_BUILD_EXAMPLES=OFF             -DAGENT_ENGINE_LLAMA=$(on llama) -DAGENT_ENGINE_ONNX=$(on onnx) -DAGENT_ENGINE_AUDIOCPP=$(on audiocpp)             -DAGENT_ENGINE_SDCPP=$(on sdcpp) -DAGENT_ENGINE_TRELLIS=$(on trellis) \
            ${{ matrix.ggml }} $extra

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        shell: bash
        run: |
          # The unit suite needs no models. Engine tests that need a downloaded model skip themselves.
          ctest --test-dir build --output-on-failure -j2 --timeout 300 -E "model|engine_real" || ctest --test-dir build --rerun-failed --output-on-failure -j1 --timeout 300

      - name: Package
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          name="agent-cpp-${v}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.variant }}"
          mkdir -p "dist/${name}/engines" assets
          cp "build/agent${{ matrix.exe_ext }}" "dist/${name}/"
          cp "build/agent-engine-host${{ matrix.exe_ext }}" "dist/${name}/" 2>/dev/null || true
          for f in build/src/engines/*/agent-engine-*.${{ matrix.lib_ext }} build/agent-engine-*.${{ matrix.lib_ext }}; do
            [ -f "$f" ] || continue
            case "$f" in *mock*) continue ;; esac # test engines are not released
            base="$(basename "$f" .${{ matrix.lib_ext }})"
            dir="$(dirname "$f")"
            # Runtime libraries the plugin loads from its own folder (libaudiocpp, ONNX Runtime, ...): shipped next to it.
            libs=()
            for l in "$dir"/*.${{ matrix.lib_ext }}*; do
              [ -f "$l" ] || continue
              case "$(basename "$l")" in agent-engine-*) continue ;; *mock*) continue ;; esac
              libs+=("$l")
            done
            cp "$f" "dist/${name}/engines/"
            [ ${#libs[@]} -gt 0 ] && cp "${libs[@]}" "dist/${name}/engines/"
            if [ ${#libs[@]} -eq 0 ]; then
              cp "$f" "assets/${base}-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.lib_ext }}"
            else
              # An engine with runtime libraries is one archive (plugin + libraries), for `agent engine pull`.
              pkg="${base}-${{ matrix.os_name }}-${{ matrix.arch }}"
              mkdir -p "stage/${pkg}"
              cp "$f" "${libs[@]}" "stage/${pkg}/"
              if [ "${{ matrix.os_name }}" = "windows" ]; then (cd stage && 7z a -tzip "../assets/${pkg}.zip" "${pkg}"); else tar -C stage -czf "assets/${pkg}.tar.gz" "${pkg}"; fi
            fi
          done
          if [ "${{ matrix.os_name }}" = "windows" ]; then cp "$VCPKG_INSTALLATION_ROOT"/installed/${{ matrix.triplet }}/bin/{libssl-3-${{ matrix.dll }},libcrypto-3-${{ matrix.dll }}}.dll "dist/${name}/"; fi
          cp LICENSE README.md "dist/${name}/"
          # third-party licences of what is compiled in
          mkdir -p "dist/${name}/licenses"
          for l in simdjson cpp-httplib miniaudio llama.cpp sqlite-vec audio.cpp stable-diffusion.cpp trellis2cpp RTXUI; do
            for f in vendor/$l/LICENSE vendor/$l/LICENSE.md vendor/$l/LICENSE.txt; do [ -f "$f" ] && cp "$f" "dist/${name}/licenses/$l.LICENSE" && break; done
          done
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            (cd dist && 7z a -tzip "../assets/${name}.zip" "${name}")
          else
            tar -C dist -czf "assets/${name}.tar.gz" "${name}"
          fi
          # A GPU build ships as its full archive only (its engine files carry the same names as the CPU build's).
          if [ -n "${{ matrix.variant }}" ]; then find assets -type f ! -name "${name}.*" -delete; fi
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.variant }}
          path: assets/*
          if-no-files-found: error

  publish:
    # A failing GPU build must not hold back the release: publish whatever was built.
    if: ${{ !cancelled() && inputs.publish }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Checksums and manifest
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          # manifest.json: one entry per file, with the platform parsed from the file name.
          {
            echo '{"version":"${{ steps.version.outputs.value }}","repository":"${{ github.repository }}","files":['
            first=1
            for f in $(ls | grep -v -e '^SHA256SUMS$' -e '^manifest.json$'); do
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              size="$(stat -c %s "$f")"
              [ $first -eq 1 ] || echo ','
              first=0
              printf '{"name":"%s","sha256":"%s","size":%s}' "$f" "$sum" "$size"
            done
            echo ']}'
          } > manifest.json
          cat manifest.json | head -c 2000

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: assets/*
