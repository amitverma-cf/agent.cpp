name: Release

# Builds the CLI and the llama engine for every platform when a version tag is pushed (or on demand), and publishes:
#   * agent-cpp-<version>-<os>-<arch>.tar.gz / .zip     the CLI, the engine host and the engines, ready to run
#   * agent-engine-<name>-<os>-<arch>.<so|dll|dylib>    each engine alone, for `agent engine pull` and `agent setup`
#   * manifest.json and SHA256SUMS                       what the downloader reads, with a SHA-256 for every file
#
# The binaries are portable: no -march=native. x86-64 targets AVX2 + FMA + F16C (any CPU since about 2015); on older
# CPUs build from source.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     os_name: linux,   arch: x86_64,  lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON" }
          - { runner: ubuntu-22.04-arm, os_name: linux,   arch: aarch64, lib_prefix: lib, lib_ext: so,    exe_ext: "",     ggml: "-DGGML_NATIVE=OFF" }
          - { runner: macos-15,         os_name: macos,   arch: aarch64, lib_prefix: lib, lib_ext: dylib, exe_ext: "",     ggml: "-DGGML_NATIVE=OFF" }
          - { runner: macos-15-intel,   os_name: macos,   arch: x86_64,  lib_prefix: lib, lib_ext: dylib, exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON", triplet: x64-windows, dll: x64 }
          - { runner: windows-11-arm,   os_name: windows, arch: aarch64, lib_prefix: "",  lib_ext: dll,   exe_ext: ".exe", ggml: "-DGGML_NATIVE=ON", triplet: arm64-windows, dll: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

      - name: Dependencies (macOS)
        if: matrix.os_name == 'macos'
        run: brew install ninja openssl@3

      - name: Dependencies (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:${{ matrix.triplet }}

      - name: Compiler environment (Windows)
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.os_name }}" = "macos" ]; then extra="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"; fi
          if [ "${{ matrix.os_name }}" = "windows" ]; then extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAGENT_BUILD_CLI=ON -DAGENT_ENGINE_LLAMA=ON -DAGENT_BUILD_EXAMPLES=OFF \
            ${{ matrix.ggml }} $extra

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        shell: bash
        run: |
          # The unit suite needs no models. Engine tests that need a downloaded model skip themselves.
          ctest --test-dir build --output-on-failure -j2 --timeout 300 -E "model|engine_real" || ctest --test-dir build --rerun-failed --output-on-failure -j1 --timeout 300

      - name: Package
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          name="agent-cpp-${v}-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "dist/${name}/engines" assets
          cp "build/agent${{ matrix.exe_ext }}" "dist/${name}/"
          cp "build/agent-engine-host${{ matrix.exe_ext }}" "dist/${name}/" 2>/dev/null || true
          for f in build/engines/*/agent-engine-*.${{ matrix.lib_ext }} build/agent-engine-*.${{ matrix.lib_ext }}; do
            [ -f "$f" ] || continue
            case "$f" in *mock*) continue ;; esac # test engines are not released
            cp "$f" "dist/${name}/engines/"
            base="$(basename "$f" .${{ matrix.lib_ext }})"
            cp "$f" "assets/${base}-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.lib_ext }}"
          done
          if [ "${{ matrix.os_name }}" = "windows" ]; then cp "$VCPKG_INSTALLATION_ROOT"/installed/${{ matrix.triplet }}/bin/{libssl-3-${{ matrix.dll }},libcrypto-3-${{ matrix.dll }}}.dll "dist/${name}/"; fi
          cp LICENSE README.md "dist/${name}/"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            (cd dist && 7z a -tzip "../assets/${name}.zip" "${name}")
          else
            tar -C dist -czf "assets/${name}.tar.gz" "${name}"
          fi
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="build-${{ github.run_number }}"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Checksums and manifest
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          # manifest.json: one entry per file, with the platform parsed from the file name.
          {
            echo '{"version":"${{ steps.version.outputs.value }}","repository":"${{ github.repository }}","files":['
            first=1
            for f in $(ls | grep -v -e '^SHA256SUMS$' -e '^manifest.json$'); do
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              size="$(stat -c %s "$f")"
              [ $first -eq 1 ] || echo ','
              first=0
              printf '{"name":"%s","sha256":"%s","size":%s}' "$f" "$sum" "$size"
            done
            echo ']}'
          } > manifest.json
          cat manifest.json | head -c 2000

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: assets/*
