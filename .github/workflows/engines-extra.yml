# Engines that have no upstream library to link: stable-diffusion.cpp publishes command-line programs only, and TRELLIS.2 (trellis2cpp)
# publishes nothing. Their plugins are built here, compiled together with their source (vendor/<name>), and published once under a release
# of their own, "engine-<name>-<first 7 letters of the vendored commit>". That release is rebuilt only when vendor/<name> moves, so the
# normal release (release.yml) does not build them. scripts/pin-components.py reads that release and writes its files into components.tsv.
#
#   gh workflow run engines-extra.yml -f engine=sdcpp
name: Engines without an upstream library

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine to build and publish: sdcpp or trellis"
        type: choice
        options: [sdcpp, trellis]
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.engine }} ${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     os_name: linux,   arch: x86_64,  lib_ext: so,  exe_ext: "",     ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON" }
          - { runner: ubuntu-24.04-arm, os_name: linux,   arch: aarch64, lib_ext: so,  exe_ext: "",     ggml: "-DGGML_NATIVE=OFF" }
          - { runner: windows-2022,     os_name: windows, arch: x86_64,  lib_ext: dll, exe_ext: ".exe", ggml: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON", triplet: x64-windows }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Which build
        id: id
        shell: bash
        run: |
          sub="${{ inputs.engine == 'sdcpp' && 'stable-diffusion.cpp' || 'trellis2cpp' }}"
          echo "value=$(git ls-tree HEAD "vendor/$sub" | awk '{print substr($3,1,7)}')" >> "$GITHUB_OUTPUT"

      - name: Dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:${{ matrix.triplet }}

      - name: Compiler environment (Windows)
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.os_name }}" = "linux" ]; then export LDFLAGS="-static-libstdc++ -static-libgcc"; fi
          if [ "${{ matrix.os_name }}" = "windows" ]; then extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"; fi
          on() { [ "${{ inputs.engine }}" = "$1" ] && echo ON || echo OFF; }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENT_BUILD_CLI=OFF -DAGENT_BUILD_EXAMPLES=OFF -DAGENT_BUILD_TESTS=OFF \
            -DAGENT_ENGINE_LLAMA=OFF -DAGENT_ENGINE_ONNX=OFF -DAGENT_ENGINE_AUDIOCPP=OFF -DAGENT_ENGINE_SDCPP=$(on sdcpp) -DAGENT_ENGINE_TRELLIS=$(on trellis) \
            ${{ matrix.ggml }} $extra
          cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          bash scripts/package-release.sh --build-dir build --out-dir assets --tag "${{ steps.id.outputs.value }}" --os ${{ matrix.os_name }} --arch ${{ matrix.arch }} \
            --lib-ext ${{ matrix.lib_ext }} --exe-ext "${{ matrix.exe_ext }}" --only ${{ inputs.engine }}
          rm -f assets/SHA256SUMS
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os_name }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true
      - name: Which build
        id: id
        run: |
          sub="${{ inputs.engine == 'sdcpp' && 'stable-diffusion.cpp' || 'trellis2cpp' }}"
          echo "value=$(git ls-tree HEAD "vendor/$sub" | awk '{print substr($3,1,7)}')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-${{ inputs.engine }}-${{ steps.id.outputs.value }}
          name: ${{ inputs.engine }} plugin for vendor commit ${{ steps.id.outputs.value }}
          body: "The ${{ inputs.engine }} engine plugin, compiled with its source (there is no upstream library to use). Built only when vendor/ moves; the installer downloads it from the list in scripts/components.tsv."
          files: assets/*
